[project]
name = "jarvis"
version = "0.1.0"
description = "JARVIS — minimal Markdown data manager (isolated, CRUD, learn)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
